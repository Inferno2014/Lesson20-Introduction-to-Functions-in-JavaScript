<!DOCTYPE html>
<html>

<head>
    <title>Multiplication using Functions in JavaScript</title>
</head>
<body>
    <center>
        <h1 style="color: darkcyan;">Multiplication using Functions</h1>
        <button type="button" onclick="myfunction()">Click Me!</button>
        <p id="demo"></p>
        <p id="demo1"></p>
        <p id="demo2"></p>
        
        <script>
            var a = 5;
            var b = 7;
            document.getElementById("demo").innerHTML = a;
            document.getElementById("demo1").innerHTML = b;
            document.getElementById("demo2").innerHTML = a * b;
        </script>
    </center>
</body>
</html>
